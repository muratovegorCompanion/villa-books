<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phangan Home Care</title>
<style>
:root{--sea:#0e4a47;--ribbon:#f0a422;--mist:#e6f1ee}
@media (prefers-color-scheme:dark){:root{--mist:#0a3533}}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--sea);color:#fff;font:400 18px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:560px}
h1{font-size:clamp(40px,10vw,76px);line-height:.95;letter-spacing:-.03em;margin:0 0 20px;font-weight:800}
h1 span{color:var(--ribbon)}
p{margin:0 0 14px;color:#d7ebe7}
a{color:var(--ribbon)}
a:focus-visible{outline:2px solid var(--ribbon);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Phangan<br><span>Home Care</span></h1>
  <p>Villa management on Koh Phangan.</p>
  <p>Guest books: <a href="/cliffside/">Cliffside Organic Pool Villa</a></p>
</main>
</body>
</html>
